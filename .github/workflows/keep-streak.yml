name: keep-streak

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:        

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: README
        run: python update_readme.py

      - name: Commit et push
        run: |
          git config user.name "TheCoderGeekSquadLeader"
          git config user.email "lepluscultive@gmail.com"
          git add README.md
          git commit -m "Update" || exit 0
          git push
